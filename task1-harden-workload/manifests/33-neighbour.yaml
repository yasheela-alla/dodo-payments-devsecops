# Neighbour service required by Task 1. "reporting" is a lightweight client that
# periodically reads ledger-api. It shares the same hardening baseline so the
# whole namespace passes PSS restricted + Kyverno, not just ledger-api.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting
  namespace: payments
  labels:
    app: reporting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reporting
  template:
    metadata:
      labels:
        app: reporting
    spec:
      serviceAccountName: reporting
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: client
          image: curlimages/curl:8.11.1
          command: ["sleep", "infinity"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          livenessProbe:
            exec:
              command: ["true"]
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["true"]
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: reporting
  namespace: payments
  labels:
    app: reporting
spec:
  selector:
    app: reporting
  clusterIP: None
  ports:
    - name: http
      port: 8080
      targetPort: 8080
