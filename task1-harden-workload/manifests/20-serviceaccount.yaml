# Dedicated least-privilege identity for ledger-api. The default SA is NOT used.
# ledger-api is a stateless HTTP service: it never calls the Kubernetes API,
# so it gets ZERO RBAC and its token is not mounted (removes a lateral-movement
# path — a compromised pod cannot talk to the API server).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ledger-api
  namespace: payments
  labels:
    app: ledger-api
automountServiceAccountToken: false
