apiVersion: v1
kind: ConfigMap
metadata:
  name: ledger-api-config
  namespace: payments
  labels:
    app: ledger-api
data:
  # Non-sensitive runtime configuration only. Secrets live in a SealedSecret.
  FETCH_TIMEOUT: "5"
  # Advisory: the app binds 8080; gunicorn args come from the image.
  APP_PORT: "8080"
