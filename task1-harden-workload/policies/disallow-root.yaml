apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-run-as-root
  annotations:
    policies.kyverno.io/title: Disallow running as root
    policies.kyverno.io/category: Pod Security, PCI DSS
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Workload containers must run as non-root with privilege escalation
      disabled and all Linux capabilities dropped. Platform/system namespaces
      (CNI, ingress, mesh, controllers) are excluded — those components
      legitimately need elevated host privileges and live outside the workload
      trust boundary.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: run-as-non-root
      match:
        any:
          - resources:
              kinds: ["Pod"]
      exclude: &infra
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - istio-system
                - kyverno
                - argocd
                - ingress-nginx
                - local-path-storage
      validate:
        message: "Containers must set runAsNonRoot: true (no root)."
        pattern:
          spec:
            =(securityContext):
              =(runAsNonRoot): "true"
            containers:
              - =(securityContext):
                  =(runAsNonRoot): "true"
    - name: drop-all-capabilities
      match:
        any:
          - resources:
              kinds: ["Pod"]
      exclude: *infra
      validate:
        message: "Containers must drop ALL capabilities."
        foreach:
          - list: request.object.spec.containers
            deny:
              conditions:
                all:
                  - key: "ALL"
                    operator: AnyNotIn
                    value: "{{ element.securityContext.capabilities.drop || `[]` }}"
    - name: no-privilege-escalation
      match:
        any:
          - resources:
              kinds: ["Pod"]
      exclude: *infra
      validate:
        message: "allowPrivilegeEscalation must be false."
        pattern:
          spec:
            containers:
              - securityContext:
                  allowPrivilegeEscalation: "false"
